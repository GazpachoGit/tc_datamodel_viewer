TcAttribute:
  types:
    POM_string:
      type: String
      array_flag: isArray
      chars:
        - maxStringLength
    POM_date:
      type: Date
      array_flag: isArray
    POM_int:
      type: Integer
      array_flag: isArray
      chars:
        - lowerBoundValue
        - upperBoundValue
    POM_double:
      type: Double
      array_flag: isArray
      chars:
        - lowerBoundValue
        - upperBoundValue
    POM_logical:
      type: Boolean
      array_flag: isArray
    POM_long_string:
      type: LongString
      array_flag: isArray
    POM_typed_reference:
      type: TypedReference
      array_flag: isArray
      chars:
        - typedRefClassName
    POM_untyped_reference:
      type: UntypedReference
      array_flag: isArray
TcCompoundPropertyRule:
  type: Compound
  chars:
    - pathToSource
